name: Tests

on:
  push:
    paths: ['src/**', 'server.js', 'index.js', 'package.json', 'testdata/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['src/**', 'server.js', 'index.js', 'package.json', 'testdata/**', '.github/workflows/test.yml']

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
